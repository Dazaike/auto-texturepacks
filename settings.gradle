pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}
plugins {
	// Auto-provisions JDK 25 (Temurin) when the host only has an older JDK.
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
	repositories {
		mavenCentral()
	}
}

rootProject.name = 'auto-texturepacks'

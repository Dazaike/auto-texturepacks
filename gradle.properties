# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Allow Gradle to provision JDK 25 automatically when the host only has an older JDK.
org.gradle.java.installations.auto-download=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=com.autopacks
archives_base_name=auto-texturepacks

# Dependencies
# Latest +26.1.2 release on Modrinth at scaffold time (verified 2026-09-12 via api.modrinth.com).
fabric_version=0.155.3+26.1.2
# Matches the modmenu jar in the target PrismLauncher instance.
modmenu_version=18.0.1
